[project]
name = "rosa"
version = "0.1.0"
description = "Rosa: el bucle de investigacion del Alzheimer (DSPy + GEPA), AI Robotix e INTEC"
requires-python = ">=3.12,<3.15"
dependencies = [
  "dspy>=3.3.1",
  "gepa>=0.0.17",
  "mlflow>=3.16",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "fastapi>=0.141",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=3.4",
  "pymupdf>=1.28",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "python-multipart>=0.0.9",
  "python-docx>=1.2.0",
]

[tool.uv]
package = false
