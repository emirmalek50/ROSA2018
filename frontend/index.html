<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El arbol del Alzheimer Project. Es la unica marca grafica de ROSA2018. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Tema ANTES de pintar. Los tokens de styles.css cuelgan de
         [data-theme]; sin esto quien tiene oscuro veria un fogonazo blanco.
         Duplica a proposito la logica de src/lib/theme.ts (aplicarTema): es
         la unica forma de que corra antes del bundle. -->
    <script>
      (function () {
        var tema = 'sistema';
        try {
          var g = localStorage.getItem('rosa-tema');
          if (g === 'claro' || g === 'oscuro' || g === 'sistema') tema = g;
        } catch (e) {
          /* navegacion privada: se queda en 'sistema' */
        }
        var oscuro =
          tema === 'oscuro' ||
          (tema === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', oscuro ? '#101010' : '#FFFFFF');
      })();
    </script>
    <title>ROSA2018 · Alzheimer Project</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
