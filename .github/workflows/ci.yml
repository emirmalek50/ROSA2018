# CI de ROSA2018: en cada push y pull request a main corre lo mismo que se
# exige antes de un commit (CLAUDE.md): tests de los dos lados, linters,
# tipos y el escaneo de secretos. No necesita claves: los tests no salen a la red.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Dependencias
        run: uv sync --frozen
      - name: Ruff
        run: uvx ruff check rosa scripts
      - name: mypy (trinquete)
        run: uv run python scripts/trinquete_mypy.py
      - name: Tests
        env:
          ROSA_BD: ${{ runner.temp }}/rosa-ci.db
        run: uv run pytest rosa/tests -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Tests
        run: npm test

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de secretos
        run: python3 scripts/escanear_secretos.py
