# mypy: comprobación de tipos del backend. Se corre con
# `python3 scripts/trinquete_mypy.py`, que falla solo si el número de errores
# sube por encima de LIMITE (el trinquete); bajarlo es el objetivo.
[mypy]
python_version = 3.12
files = rosa
exclude = (?x)(^rosa/tests/)
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_configs = True
